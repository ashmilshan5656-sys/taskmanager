{% extends 'myapp/base.html' %}

{% block content %}
<h2>Delete Task</h2>
<p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Delete</button>
    <a href="{% url 'task_list' %}" class="btn secondary">Cancel</a>
</form>
{% endblock %}
