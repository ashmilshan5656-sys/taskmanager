<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1c2430; }
        .container { max-width: 980px; margin: 40px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        nav a { color: #0d6efd; text-decoration: none; margin-left: 12px; }
        .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; border: none; background: #0d6efd; color: white; text-decoration: none; cursor: pointer; }
        .btn.secondary { background: #6c757d; }
        .btn.danger { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; border-bottom: 1px solid #e9ecef; text-align: left; }
        th { background: #f8f9fa; }
        .actions a { margin-right: 10px; }
        form { display: grid; gap: 12px; }
        label { font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; }
        .errorlist { color: #dc3545; list-style: none; padding: 0; margin: 0; }
        .message { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; background: #e7f7ed; color: #0f5132; }
    </style>
</head>
<body>
    <div class="container">
        {% if user.is_authenticated %}
        <nav>
            <strong>Task Management</strong>
            <div>
                <a href="{% url 'task_list' %}">Tasks</a>
                <a href="{% url 'logout' %}">Logout</a>
            </div>
        </nav>
        {% endif %}
        <div class="card">
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
